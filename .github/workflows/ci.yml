name: ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        # 版本以根 package.json 的 packageManager 为准，勿再写 version
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm fixtures
      # workspace 包依赖 @docbin/core 的 dist，须先 build 再 typecheck
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test
